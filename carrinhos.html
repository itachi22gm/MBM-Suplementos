<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MBM Suplementos - Carrinho</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }
        .cart-table th, .cart-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #dee2e6; }
        .cart-table th { background: var(--primary-color); color: white; }
        .total-box { background: var(--card-bg); padding: 1.5rem; text-align: right; border-radius: 8px; }
        .actions { display: flex; justify-content: space-between; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Seu Carrinho de Compras</h2>
        
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>100% Whey Protein Isolado</strong></td>
                    <td>R$ 159,90</td>
                    <td><input type="number" value="1" style="width: 60px; padding: 5px; text-align: center;"></td>
                    <td>R$ 159,90</td>
                </tr>
            </tbody>
        </table>
        
        <div class="total-box">
            <h3>Total do Carrinho: <span style="color: var(--success-color);">R$ 159,90</span></h3>
        </div>
        
        <div class="actions">
            <a href="produtos.html" class="btn" style="width: auto; background: #6c757d;">Voltar a Comprar</a>
            <a href="compra.html" class="btn btn-accent" style="width: auto;">Avançar para o Pagamento</a>
        </div>
    </div>
</body>
</html>
