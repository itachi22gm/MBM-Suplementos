<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MBM Suplementos - Vitrine</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-image {
            height: 150px;
            background: #f1f3f5;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-weight: bold;
            border-radius: 6px;
        }
        .price { font-size: 1.3rem; color: var(--success-color); font-weight: bold; margin: 0.5rem 0 1rem 0; }
        .nav-cart { text-align: right; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-cart">
            <a href="carrinho.html" class="btn btn-accent" style="width: auto; padding: 0.5rem 1.5rem;">Ver Meu Carrinho 🛒</a>
        </div>
        
        <h2>Suplementos em Destaque</h2>
        
        <div class="products-grid">
            <div class="product-card">
                <div class="product-image">100% Whey Protein 900g</div>
                <h3>Whey Protein Isolado</h3>
                <p class="price">R$ 159,90</p>
                <a href="carrinho.html" class="btn">Adicionar ao Carrinho</a>
            </div>
            <div class="product-card">
                <div class="product-image">Creatina Monohidratada 300g</div>
                <h3>Creatina Pura</h3>
                <p class="price">R$ 89,90</p>
                <a href="carrinho.html" class="btn">Adicionar ao Carrinho</a>
            </div>
            <div class="product-card">
                <div class="product-image">Pré-Treino C4 Extreme 200g</div>
                <h3>Pré-Treino Explosivo</h3>
                <p class="price">R$ 129,90</p>
                <a href="carrinho.html" class="btn">Adicionar ao Carrinho</a>
            </div>
        </div>
    </div>
</body>
</html>
